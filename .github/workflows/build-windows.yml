name: Build Windows (exe)

on:
  workflow_dispatch:        # 仓库页面 Actions 里手动点 Run
  push:
    tags: ['v*']            # 或推 v1.0 这类标签时自动打包

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps (desktop)
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: desktop
        run: npm run tauri build

      - name: Upload .exe installer (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: DDL-Manager-Windows-NSIS
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload .msi installer
        uses: actions/upload-artifact@v4
        with:
          name: DDL-Manager-Windows-MSI
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore
