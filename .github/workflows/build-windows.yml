name: Build Windows (exe)

on:
  workflow_dispatch:        # 仓库页面 Actions 里手动点 Run，可填要上传的 Release 标签
    inputs:
      release_tag:
        description: '要上传到的 Release 标签（例如 v1.0.0），留空则只上传到 Actions 构件'
        required: false
        default: ''
  push:
    tags: ['v*']            # 推 v1.x 这类标签时自动打包并上传到该 Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps (desktop)
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app (NSIS / MSI + updater signature)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Upload installers to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DDL-Manager-Windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: ignore

      - name: Upload to GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.release_tag }}
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.sig
          overwrite: true
          fail_on_unmatched_files: false
